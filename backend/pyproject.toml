[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
# E501: line length enforced by Black instead.
# B008: FastAPI's idiomatic pattern is `Depends(...)` as an argument
# default (e.g. `db: AsyncSession = Depends(get_db)`) — not the "mutable
# default" footgun this rule is meant to catch.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
